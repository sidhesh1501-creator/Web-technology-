<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentSphere Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            padding: 30px 15px;

            background:
                radial-gradient(circle at 15% 20%, #7c3aed, transparent 30%),
                radial-gradient(circle at 85% 80%, #06b6d4, transparent 30%),
                linear-gradient(135deg, #020617, #111827, #1e1b4b);

            overflow-x: hidden;
        }

        /* 3D floating objects */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(2px);
            opacity: 0.5;
            animation: float 6s ease-in-out infinite;
        }

        .orb1 {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #a855f7, #4c1d95);
            top: 30px;
            left: 20px;
        }

        .orb2 {
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, #22d3ee, #0e7490);
            bottom: 20px;
            right: 20px;
            animation-delay: 2s;
        }

        .orb3 {
            width: 90px;
            height: 90px;
            background: #ec4899;
            top: 50%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-30px) rotate(15deg);
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 1000px;

            margin: auto;

            display: grid;
            grid-template-columns: 0.9fr 1.1fr;

            gap: 25px;

            padding: 25px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(20px);

            border: 1px solid rgba(255,255,255,0.2);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.4);
        }

        /* Left side */
        .intro {
            min-height: 600px;

            padding: 40px 30px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(124,58,237,0.7),
                    rgba(8,145,178,0.3)
                );

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;

            border-radius: 20px;

            background: white;

            color: #4c1d95;

            margin-bottom: 25px;

            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .intro h1 {
            font-size: 55px;
            line-height: 1;
            margin-bottom: 20px;
        }

        .intro h1 span {
            background: linear-gradient(
                90deg,
                white,
                #67e8f9,
                #d8b4fe
            );

            -webkit-background-clip: text;
            color: transparent;
        }

        .intro p {
            line-height: 1.7;
            color: #ddd6fe;
        }

        .features {
            margin-top: 30px;
        }

        .feature {
            padding: 13px;
            margin-top: 12px;

            border-radius: 12px;

            background: rgba(255,255,255,0.1);

            transition: 0.3s;
        }

        .feature:hover {
            transform: translateX(8px);
        }

        /* Form section */
        .form-panel {
            padding: 35px 30px;

            border-radius: 22px;

            background: rgba(2,6,23,0.45);
        }

        .form-panel small {
            color: #67e8f9;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .form-panel h2 {
            font-size: 30px;
            margin: 10px 0;
        }

        .description {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.15);

            outline: none;

            background: rgba(255,255,255,0.07);

            color: white;

            font-size: 15px;
        }

        input::placeholder {
            color: #64748b;
        }

        select option {
            background: #0f172a;
            color: white;
        }

        input:focus,
        select:focus {
            border-color: #22d3ee;

            box-shadow:
                0 0 15px rgba(34,211,238,0.2);
        }

        /* Generate button */
        #generateBtn {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #0891b2
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 12px 30px rgba(124,58,237,0.3);
        }

        #generateBtn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 18px 35px rgba(8,145,178,0.4);
        }

        #generateBtn:active {
            transform: scale(0.97);
        }

        /* Profile */
        #profileContainer {
            margin-top: 25px;
        }

        .student-profile {
            padding: 22px;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.13),
                    rgba(255,255,255,0.04)
                );

            border: 1px solid rgba(34,211,238,0.35);

            box-shadow:
                0 20px 40px rgba(0,0,0,0.3);

            animation: showProfile 0.4s ease;
        }

        @keyframes showProfile {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .profile-heading {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 18px;
        }

        .profile-icon {
            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );

            font-size: 23px;
        }

        .profile-heading h3 {
            font-size: 20px;
        }

        .success {
            color: #67e8f9;
            font-size: 12px;
            margin-top: 3px;
        }

        .detail {
            display: flex;
            justify-content: space-between;

            padding: 12px 0;

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            gap: 10px;
        }

        .detail:last-of-type {
            border-bottom: none;
        }

        .detail-label {
            color: #94a3b8;
        }

        .detail-value {
            font-weight: bold;
            text-align: right;
        }

        /* Remove button */
        .remove-btn {
            width: 100%;

            padding: 12px;

            margin-top: 18px;

            border-radius: 12px;

            border: 1px solid rgba(248,113,113,0.4);

            background: rgba(239,68,68,0.12);

            color: #fca5a5;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .remove-btn:hover {
            background: #dc2626;
            color: white;
        }

        /* Mobile */
        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }

            .intro {
                min-height: auto;
            }
        }

        @media (max-width: 500px) {
            .intro h1 {
                font-size: 42px;
            }

            .container {
                padding: 12px;
            }

            .intro,
            .form-panel {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- 3D Background -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>


    <!-- MAIN APPLICATION -->
    <div class="container">

        <!-- LEFT SIDE -->

        <div class="intro">

            <div class="logo">
                🎓
            </div>

            <h1>
                Student<br>
                <span>Sphere</span>
            </h1>

            <p>
                Build your digital student profile
                instantly using JavaScript DOM
                manipulation.
            </p>

            <div class="features">

                <div class="feature">
                    ⚡ Instant Profile Preview
                </div>

                <div class="feature">
                    ✨ Dynamic DOM Creation
                </div>

                <div class="feature">
                    🗑️ Easy Profile Removal
                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="form-panel">

            <small>
                STUDENT REGISTRATION
            </small>

            <h2>
                Create Your Profile
            </h2>

            <p class="description">
                Enter your details and generate
                your student profile.
            </p>


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

            </div>


            <!-- REGISTER NUMBER -->

            <div class="form-group">

                <label for="regNo">
                    Register Number
                </label>

                <input
                    type="text"
                    id="regNo"
                    placeholder="Enter register number"
                >

            </div>


            <!-- DEPARTMENT -->

            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <select id="department">

                    <option value="">
                        Select Department
                    </option>

                    <option value="B.Tech IT">
                        B.Tech IT
                    </option>

                    <option value="B.Tech CSE">
                        B.Tech CSE
                    </option>

                    <option value="B.Tech AI & DS">
                        B.Tech AI & DS
                    </option>

                    <option value="B.E ECE">
                        B.E ECE
                    </option>

                    <option value="B.E Mechanical">
                        B.E Mechanical
                    </option>

                </select>

            </div>


            <!-- YEAR -->

            <div class="form-group">

                <label for="year">
                    Year of Study
                </label>

                <select id="year">

                    <option value="">
                        Select Year
                    </option>

                    <option value="1st Year">
                        1st Year
                    </option>

                    <option value="2nd Year">
                        2nd Year
                    </option>

                    <option value="3rd Year">
                        3rd Year
                    </option>

                    <option value="4th Year">
                        4th Year
                    </option>

                </select>

            </div>


            <!-- GENERATE BUTTON -->

            <button id="generateBtn" type="button">
                ✨ Generate Student Profile
            </button>


            <!-- PROFILE WILL APPEAR HERE -->

            <div id="profileContainer"></div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // Get button and profile container
        const generateBtn =
            document.getElementById("generateBtn");

        const profileContainer =
            document.getElementById("profileContainer");


        // Generate button click event
        generateBtn.addEventListener("click", function () {

            // Get values from input fields
            const name =
                document.getElementById("name").value.trim();

            const regNo =
                document.getElementById("regNo").value.trim();

            const department =
                document.getElementById("department").value;

            const year =
                document.getElementById("year").value;


            // Check whether all fields are filled
            if (
                name === "" ||
                regNo === "" ||
                department === "" ||
                year === ""
            ) {

                alert("⚠️ Please fill all the fields.");

                return;
            }


            // Remove previous profile
            profileContainer.innerHTML = "";


            // Create main profile element
            const profile =
                document.createElement("div");

            profile.classList.add("student-profile");


            // Create profile heading
            const heading =
                document.createElement("div");

            heading.classList.add("profile-heading");


            // Create profile icon
            const icon =
                document.createElement("div");

            icon.classList.add("profile-icon");

            icon.textContent = "🎓";


            // Create title
            const titleBox =
                document.createElement("div");


            const title =
                document.createElement("h3");

            title.textContent =
                "Student Profile";


            const success =
                document.createElement("div");

            success.classList.add("success");

            success.textContent =
                "✓ Profile Generated Successfully";


            titleBox.appendChild(title);

            titleBox.appendChild(success);

            heading.appendChild(icon);

            heading.appendChild(titleBox);


            // Function to create student details
            function createDetail(label, value) {

                const detail =
                    document.createElement("div");

                detail.classList.add("detail");


                const labelElement =
                    document.createElement("span");

                labelElement.classList.add("detail-label");

                labelElement.textContent =
                    label;


                const valueElement =
                    document.createElement("span");

                valueElement.classList.add("detail-value");

                valueElement.textContent =
                    value;


                detail.appendChild(labelElement);

                detail.appendChild(valueElement);


                return detail;
            }


            // Create details
            const studentName =
                createDetail("Student Name", name);

            const registerNumber =
                createDetail("Register Number", regNo);

            const studentDepartment =
                createDetail("Department", department);

            const studentYear =
                createDetail("Year of Study", year);


            // Create remove button
            const removeBtn =
                document.createElement("button");

            removeBtn.classList.add("remove-btn");

            removeBtn.textContent =
                "🗑 Remove Student Profile";


            // Remove button event
            removeBtn.addEventListener("click", function () {

                profile.remove();

            });


            // Add all elements to profile
            profile.appendChild(heading);

            profile.appendChild(studentName);

            profile.appendChild(registerNumber);

            profile.appendChild(studentDepartment);

            profile.appendChild(studentYear);

            profile.appendChild(removeBtn);


            // Display profile
            profileContainer.appendChild(profile);

        });

    </script>

</body>
</html>
