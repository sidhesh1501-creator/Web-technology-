<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>3D Event Registration</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px;

font-family:Arial;
color:white;

background:
radial-gradient(circle at 15% 20%,#7c3aed,transparent 30%),
radial-gradient(circle at 85% 80%,#06b6d4,transparent 30%),
#020617;
}

.container{
width:100%;
max-width:650px;
padding:35px;

border-radius:30px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.2);

box-shadow:0 30px 80px rgba(0,0,0,.5);

transform-style:preserve-3d;
}

h1{
text-align:center;
color:#67e8f9;
}

label{
display:block;
margin-top:15px;
}

input,select,button{
width:100%;
padding:14px;
margin-top:8px;

border:0;
border-radius:12px;
outline:none;
}

input,select{
background:#1e293b;
color:white;
}

button{
background:linear-gradient(135deg,#7c3aed,#06b6d4);
color:white;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-4px);
}

#status{
margin-top:20px;
padding:20px;

border-radius:15px;

background:rgba(255,255,255,.07);

color:#67e8f9;

text-align:center;

min-height:55px;
}

</style>
</head>

<body>

<div class="container">

<h1>🎫 3D Event Registration</h1>

<form id="form">

<label>Name</label>

<input
id="name"
placeholder="Enter your name"
onfocus="eventMessage('FOCUS event')"
onblur="eventMessage('BLUR event')"
>

<label>Email</label>

<input
id="email"
type="email"
placeholder="Enter email"
>

<label>Event</label>

<select id="event">

<option value="">Select Event</option>
<option>Hackathon</option>
<option>Tech Fest</option>
<option>Workshop</option>
<option>Seminar</option>

</select>

<button
id="register"
type="submit"
onclick="buttonClicked()">

🚀 Register

</button>

</form>

<div id="status">
Waiting for event...
</div>

</div>

<script>

const status=document.getElementById("status");

const name=document.getElementById("name");

const email=document.getElementById("email");

const event=document.getElementById("event");

const button=document.getElementById("register");


function eventMessage(message){

status.textContent="⚡ "+message;

}


function buttonClicked(){

eventMessage("onclick event triggered");

}


name.addEventListener("input",()=>{

eventMessage(
"⌨️ input: "+name.value
);

});


event.addEventListener("change",()=>{

eventMessage(
"🔄 change: "+event.value
);

});


email.addEventListener("focus",()=>{

eventMessage("🎯 focus event");

});


email.addEventListener("blur",()=>{

eventMessage("👋 blur event");

});


button.addEventListener("mouseover",()=>{

eventMessage("🖱 mouseover event");

});


button.addEventListener("mouseout",()=>{

eventMessage("🖱 mouseout event");

});


document.getElementById("form")
.addEventListener("submit",(e)=>{

e.preventDefault();

if(!name.value.trim() ||
!email.value.trim() ||
!event.value){

eventMessage("⚠️ Please fill all fields.");

return;

}

eventMessage(
"🎉 Registration successful!"
);

});

</script>

</body>
</html>
