<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Experiment 1 - Student Profile</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;

    background:
        radial-gradient(circle at 15% 20%, #7c3aed, transparent 30%),
        radial-gradient(circle at 85% 80%, #0891b2, transparent 30%),
        #020617;
}

.container {
    width: 100%;
    max-width: 900px;
    padding: 35px;
    border-radius: 30px;

    background: rgba(255,255,255,0.09);
    backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.controls {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
    margin-bottom: 25px;
}

input, select, button {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    outline: none;
}

input, select {
    background: #1e293b;
    color: white;
}

select option {
    background: #1e293b;
}

button {
    cursor: pointer;
    color: white;
    font-weight: bold;
    background: linear-gradient(135deg,#7c3aed,#0891b2);
}

button:hover {
    transform: translateY(-2px);
}

.profile {
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    transition: 0.3s;
}

.profile h2 {
    margin-top: 0;
}

.hidden {
    display: none;
}

@media(max-width:600px) {
    .controls {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎓 Student Profile Studio</h1>

<div class="controls">

<input id="headingInput"
       placeholder="New heading">

<input id="textInput"
       placeholder="New profile text">

<select id="textColor">
    <option value="white">White</option>
    <option value="#67e8f9">Cyan</option>
    <option value="#f472b6">Pink</option>
    <option value="#86efac">Green</option>
</select>

<select id="backgroundColor">
    <option value="rgba(255,255,255,0.1)">Glass</option>
    <option value="#312e81">Purple</option>
    <option value="#164e63">Cyan</option>
    <option value="#4c0519">Rose</option>
</select>

<button id="headingBtn">Change Heading</button>

<button id="textBtn">Change Text</button>

<button id="textColorBtn">Change Text Colour</button>

<button id="backgroundBtn">Change Background</button>

<button id="toggleBtn">Show / Hide Profile</button>

</div>

<div class="profile" id="profile">

<h2 id="profileHeading">
Student Profile
</h2>

<p class="profileText">
Name: Sidhesh<br>
Register Number: 26IT101<br>
Department: B.Tech IT<br>
Semester: III
</p>

</div>

</div>

<script>

const heading =
document.getElementById("profileHeading");

const profile =
document.querySelector("#profile");

const profileText =
document.querySelector(".profileText");


document.getElementById("headingBtn")
.addEventListener("click", function() {

    const value =
    document.getElementById("headingInput").value.trim();

    if(value !== "") {
        heading.textContent = value;
    }

});


document.getElementById("textBtn")
.addEventListener("click", function() {

    const value =
    document.getElementById("textInput").value.trim();

    if(value !== "") {
        profileText.textContent = value;
    }

});


document.getElementById("textColorBtn")
.addEventListener("click", function() {

    const color =
    document.getElementById("textColor").value;

    profileText.style.color = color;

    profileText.classList.add("changed");

    profileText.setAttribute(
        "data-color",
        color
    );

});


document.getElementById("backgroundBtn")
.addEventListener("click", function() {

    const color =
    document.getElementById("backgroundColor").value;

    profile.style.background = color;

});


document.getElementById("toggleBtn")
.addEventListener("click", function() {

    profile.classList.toggle("hidden");

    this.textContent =
    profile.classList.contains("hidden")
    ? "Show Profile"
    : "Hide Profile";

});

</script>

</body>
</html>
